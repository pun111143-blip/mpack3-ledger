<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="엠팩3 가계부">
<meta name="description" content="엠팩3노래연습장 가계부 조회용 대시보드">
<title>엠팩3 가계부</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{
  --bg:#0A1020;
  --bg-soft:#0E1626;
  --card:#121C31;
  --card-2:#17233C;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.14);
  --text:#EAF1FF;
  --sub:#93A4C6;
  --muted:#5F7093;
  --mint:#3DDC97;
  --mint-soft:rgba(61,220,151,.13);
  --rose:#FF7386;
  --rose-soft:rgba(255,115,134,.13);
  --amber:#FBBF24;
  --amber-soft:rgba(251,191,36,.13);
  --sky:#4CC3F7;
  --sky-soft:rgba(76,195,247,.13);
  --violet:#A78BFA;
  --violet-soft:rgba(167,139,250,.13);
  --shadow:0 10px 24px rgba(0,0,0,.28);
  --radius:18px;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
html[data-theme="light"]{
  --bg:#EEF2F9;
  --bg-soft:#E7EDF7;
  --card:#FFFFFF;
  --card-2:#F5F8FD;
  --line:rgba(16,26,48,.08);
  --line-strong:rgba(16,26,48,.16);
  --text:#101A2E;
  --sub:#5A6B8C;
  --muted:#8C9AB6;
  --mint:#12A56F;
  --mint-soft:rgba(18,165,111,.11);
  --rose:#E14358;
  --rose-soft:rgba(225,67,88,.10);
  --amber:#B67A00;
  --amber-soft:rgba(182,122,0,.11);
  --sky:#0C82C4;
  --sky-soft:rgba(12,130,196,.11);
  --violet:#7C5CE0;
  --violet-soft:rgba(124,92,224,.11);
  --shadow:0 8px 20px rgba(20,34,60,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 55% at 50% -12%, rgba(61,220,151,.10) 0%, rgba(10,16,32,0) 62%),
    radial-gradient(90% 45% at 108% 0%, rgba(76,195,247,.08) 0%, rgba(10,16,32,0) 60%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px;
  line-height:1.42;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
  overflow-wrap:break-word;
  overscroll-behavior-y:contain;
}
html[data-theme="light"] body{
  background:
    radial-gradient(120% 55% at 50% -12%, rgba(18,165,111,.10) 0%, rgba(238,242,249,0) 62%),
    radial-gradient(90% 45% at 108% 0%, rgba(12,130,196,.08) 0%, rgba(238,242,249,0) 60%),
    var(--bg);
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font-family:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ================= gate (잠금 · 연결) ================= */
.gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 28px) 20px calc(var(--safe-b) + 28px);
}
.gate-inner{width:100%;max-width:340px;text-align:center}
.gate-logo{
  width:62px;height:62px;border-radius:20px;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  background:linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid var(--line-strong);box-shadow:var(--shadow);
}
.gate h1{font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
.gate-sub{margin:0 0 22px;color:var(--sub);font-size:13px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
.dots i{
  width:14px;height:14px;border-radius:50%;background:var(--card-2);
  border:1px solid var(--line-strong);transition:.16s;
}
.dots i.on{background:var(--mint);border-color:var(--mint);transform:scale(1.08);box-shadow:0 0 0 4px var(--mint-soft)}
.gate-err{min-height:18px;font-size:12.5px;color:var(--rose);margin-bottom:6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.keypad button{
  height:54px;border-radius:16px;font-size:21px;font-weight:600;
  background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s,background .15s;
}
.keypad button:active{transform:scale(.96);background:var(--card-2)}
.keypad button.ghost{background:transparent;border-color:transparent;color:var(--sub);font-size:16px}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.gate-links{display:flex;justify-content:center;gap:16px;font-size:12.5px;color:var(--sub)}
.gate-links button{color:var(--sub);text-decoration:underline;text-underline-offset:3px}

.setup{width:100%;max-width:380px;text-align:left}
.setup h1{font-size:18px;margin:0 0 4px}
.setup .lead{margin:0 0 18px;color:var(--sub);font-size:12.5px;line-height:1.6}
.setup ol.help{font-size:12.5px;color:var(--sub);line-height:1.7;padding-left:18px;margin:0 0 20px}
.setup label{display:block;font-size:12px;color:var(--sub);margin-bottom:14px}
.setup input{
  width:100%;margin-top:6px;height:46px;border-radius:13px;padding:0 14px;
  background:var(--card);border:1px solid var(--line-strong);color:var(--text);font-size:14px;
}
.setup input::placeholder{color:var(--muted)}
.btn-primary{
  width:100%;height:50px;border-radius:15px;font-size:15px;font-weight:700;
  background:var(--mint);color:#062015;margin-top:4px;
}
html[data-theme="light"] .btn-primary{color:#fff}
.btn-plain{width:100%;height:44px;border-radius:13px;font-size:13px;color:var(--sub);margin-top:10px}
.setup-msg{font-size:12.5px;color:var(--rose);min-height:18px;margin-top:10px;text-align:center}

/* ================= app ================= */
.app{max-width:520px;margin:0 auto;padding:0 14px calc(var(--safe-b) + 24px)}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 12px) 2px 10px;
  background:var(--bg);
  box-shadow:0 6px 12px -8px rgba(0,0,0,.55), 0 1px 0 var(--line);
}
html[data-theme="light"] .topbar{box-shadow:0 6px 12px -8px rgba(20,34,60,.25), 0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{
  width:36px;height:36px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:var(--card);border:1px solid var(--line);
}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:-.02em;white-space:nowrap}
.brand .meta{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{margin-left:auto;display:flex;gap:6px}
.tools button{
  width:34px;height:34px;border-radius:11px;font-size:15px;
  background:var(--card);border:1px solid var(--line);color:var(--sub);
  display:flex;align-items:center;justify-content:center;
}
.tools button:active{background:var(--card-2)}
.tools button.busy{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:none;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--sub);background:var(--card);border:1px solid var(--line);transition:.15s;
}
.tabs button.on{background:var(--text);color:var(--bg);border-color:transparent}
html[data-theme="light"] .tabs button.on{background:#101A2E;color:#fff}

.banner{
  display:flex;gap:8px;align-items:flex-start;
  padding:10px 12px;border-radius:13px;margin-bottom:12px;font-size:11.5px;line-height:1.5;
  background:var(--amber-soft);color:var(--amber);border:1px solid rgba(251,191,36,.22);
}
.banner b{font-weight:700}

/* KPI */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi .card{margin:0}
.kpi .main{grid-column:1/-1;padding:16px 16px 12px}
.kpi .label{font-size:11.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .value{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.kpi .value small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px;letter-spacing:0}
.kpi .half .value{font-size:19px;margin-top:5px}
.kpi .half{padding:13px 14px}
.kpi .main .value.mint{color:var(--mint)}
.kpi .main .value.rose{color:var(--rose)}
.spark{display:flex;align-items:flex-end;gap:2px;height:38px;margin-top:12px}
.spark i{flex:1;background:var(--mint-soft);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.spark i.on{background:var(--mint)}
.spark-wrap{margin-top:10px}
.spark-legend{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}

/* 매출 비중 */
.card{
  background:linear-gradient(180deg,var(--card),var(--card));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 15px;margin-bottom:10px;box-shadow:var(--shadow);
}
.card h2{font-size:12.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:baseline;gap:7px;color:var(--text)}
.card h2 span{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted)}
.mixbar{display:flex;height:11px;border-radius:999px;overflow:hidden;background:var(--card-2);border:1px solid var(--line)}
.mixbar i{height:100%;min-width:0;padding:0;border:0;border-radius:0;box-shadow:none;background:none}
.mixbar i.d-cash{background:var(--amber)}
.mixbar i.d-card{background:var(--sky)}
.mixbar i.d-tr{background:var(--violet)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.legend .it{min-width:0}
.legend .k{font-size:10.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
.legend .k b{display:block;width:7px;height:7px;border-radius:50%;flex:none;padding:0;margin:0}
.legend .k b.d-cash{background:var(--amber)}.legend .k b.d-card{background:var(--sky)}.legend .k b.d-tr{background:var(--violet)}
.legend .v{font-size:13px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.legend .p{font-size:10.5px;color:var(--muted);margin-top:1px}

/* 지출 분류 */
.cat{border:1px solid var(--line);border-radius:15px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.cat-head{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left}
.cat-head .no{
  width:22px;height:22px;border-radius:7px;flex:none;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;background:var(--card-2);color:var(--sub);
}
.cat-head .nm{font-size:13px;font-weight:700}
.cat-head .sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.cat-head .amt{margin-left:auto;text-align:right;font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.cat-head .pct{font-size:10.5px;color:var(--muted);text-align:right;margin-top:1px}
.cat-head .chev{width:16px;flex:none;color:var(--muted);font-size:10px;transition:transform .2s}
.cat.open .chev{transform:rotate(90deg)}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.cat.open .cat-body{grid-template-rows:1fr}
.cat-body>div{overflow:hidden}
.items{padding:0 14px 12px}
.row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{font-size:12.5px;color:var(--text);min-width:0}
.row .memo{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.row .amt{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.row.sub{background:var(--card-2);margin:8px -14px;padding:7px 14px;border-top:0}
.row.sub .nm{font-weight:700;font-size:12px}
.row.sub .amt{font-weight:800}
.cat-empty{padding:2px 14px 12px;font-size:11.5px;color:var(--muted)}

/* 일별 표 */
.tbl{padding:0}
.tbl .tr{display:grid;grid-template-columns:40px 1fr 1fr 1fr 1fr;align-items:center;gap:4px;padding:7px 12px;font-size:11.5px}
.tbl .td{text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tbl .thead{font-size:10.5px;color:var(--muted);font-weight:600;padding-top:2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tbl .thead .td{font-weight:600}
.tbl .rb{border-top:1px solid var(--line)}
.tbl .day{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:11.5px}
.tbl .day b{font-size:12px;font-weight:700;color:var(--text);min-width:16px;text-align:right}
.tbl .day span{font-size:9.5px;color:var(--muted);width:11px}
.tbl .day span.sat{color:var(--sky)}
.tbl .day span.sun{color:var(--rose)}
.tbl .zero{color:var(--muted)}
.tbl .tot{font-weight:700;color:var(--text)}
.tbl .empty{opacity:.45}
.tbl .best{background:var(--mint-soft)}
.tbl .best .td,.tbl .best .day b{color:var(--mint)}
.tbl .sum{background:var(--card-2);font-weight:800;border-radius:10px;margin-top:4px}
.tbl .sum .td{color:var(--text)}
.tbl .today .day b::after{content:"·";color:var(--mint);margin-left:2px}

/* 월별 추이 */
.trend-item{border-top:1px solid var(--line);padding:12px 0}
.trend-item:first-of-type{border-top:0;padding-top:2px}
.trend-item .m{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.trend-item .m b{font-size:13.5px;font-weight:700}
.trend-item .m span{font-size:11px;color:var(--muted);margin-left:auto}
.trend-item .m .profit{font-size:12.5px;font-weight:700;margin-left:auto}
.trend-item .m .profit.up{color:var(--mint)}
.trend-item .m .profit.down{color:var(--rose)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-row .k{font-size:10.5px;color:var(--sub);width:34px;flex:none}
.bar-track{flex:1;height:9px;border-radius:999px;background:var(--card-2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:999px}
.bar-track i.rev{background:var(--mint)}
.bar-track i.exp{background:var(--rose)}
.bar-row .v{font-size:11px;color:var(--sub);width:62px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-top:10px}
.split .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.split .kv span{color:var(--muted)}
.split .kv b{font-weight:600;font-variant-numeric:tabular-nums}

/* 참고 */
.notes{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.notes p{margin:0 0 6px;font-size:10.5px;color:var(--muted);line-height:1.55;padding-left:9px;position:relative}
.notes p::before{content:"·";position:absolute;left:0}

.foot{text-align:center;font-size:10.5px;color:var(--muted);padding:14px 0 4px;line-height:1.7}
.foot a{color:var(--muted)}
.skeleton{height:14px;border-radius:6px;background:var(--card-2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 22px);transform:translate(-50%,0);
  background:var(--card-2);border:1px solid var(--line-strong);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:12.5px;z-index:60;box-shadow:var(--shadow);
  opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,-6px)}
</style>
</head>
<body>

<!-- ========== 잠금 화면 ========== -->
<div class="gate" id="gate">
  <div class="gate-inner" id="gatePanel">
    <div class="gate-logo">📊</div>
    <h1>엠팩3 가계부</h1>
    <p class="gate-sub" id="gateSub">4자리 비밀번호를 입력하세요</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="gate-err" id="gateErr"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="ghost" id="btnDemo2">예시</button><button data-k="0">0</button><button data-k="del" class="ghost">⌫</button>
    </div>
    <div class="gate-links">
      <button id="btnSetup">시트 연결 설정</button>
    </div>
  </div>

  <!-- ========== 시트 연결 화면 ========== -->
  <div class="setup" id="setupPanel" hidden>
    <h1>시트 연결</h1>
    <p class="lead">구글 시트에 붙여 넣은 Apps Script 웹앱 주소를 입력하면 가계부가 실시간으로 연결됩니다. 한 번만 입력하면 이 폰에 저장됩니다.</p>
    <ol class="help">
      <li>스프레드시트 → 확장 프로그램 → Apps Script</li>
      <li>Code.gs 붙여넣기 → 배포 → 새 배포 → 웹 앱</li>
      <li>액세스 권한 <b>모든 사용자</b> → 배포 → 주소 복사</li>
    </ol>
    <label>웹앱 주소
      <input id="inpApi" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://script.google.com/macros/s/.../exec">
    </label>
    <label>4자리 비밀번호
      <input id="inpPin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    </label>
    <button class="btn-primary" id="btnConnect">연결하고 열기</button>
    <div class="setup-msg" id="setupMsg"></div>
    <button class="btn-plain" id="btnDemo3">연결 전에 예시 화면 보기</button>
    <button class="btn-plain" id="btnBack">돌아가기</button>
  </div>
</div>

<!-- ========== 본문 ========== -->
<div class="app" id="app" hidden>
  <div class="topbar">
    <div class="brand">
      <div class="logo">📊</div>
      <div style="min-width:0">
        <h1>엠팩3 가계부</h1>
        <div class="meta" id="metaLine">불러오는 중…</div>
      </div>
    </div>
    <div class="tools">
      <button id="btnTheme" aria-label="테마 바꾸기">◐</button>
      <button id="btnRefresh" aria-label="새로고침">↻</button>
      <button id="btnLock" aria-label="잠금">🔒</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   엠팩3노래연습장 가계부 대시보드
   - 실제 숫자는 구글 시트에서 Apps Script(Code.gs)를 통해 읽습니다.
   - 저장소(공개)에는 실제 금액을 넣지 않습니다. '예시 화면'은 안내용 가짜 숫자입니다.
   ============================================================ */

// 배포 후 Code.gs 웹앱 주소를 여기에 넣으면 모든 기기에서 붙여넣기 없이 열립니다.
const DEFAULT_API = '';   // 예: 'https://script.google.com/macros/s/AKfy.../exec'

const KEY = {
  api: 'mp3ledger.api',
  hash: 'mp3ledger.hash',
  theme: 'mp3ledger.theme',
  month: 'mp3ledger.month',
  cache: 'mp3ledger.cache.'
};

const state = {
  api: '',
  data: null,        // 현재 달 응답
  months: [],
  month: '',
  view: 'month',     // 'month' | 'trend'
  demo: false,
  pinBuf: '',
  locked: true,
  busy: false
};

const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat('ko-KR');

/* ---------- 숫자·문자 helpers ---------- */
const won   = n => nf.format(Math.round(Number(n) || 0));
const wonK  = n => {
  n = Number(n) || 0;
  const a = Math.abs(n);
  if (a >= 100000000) return (n / 100000000).toFixed(a >= 1000000000 ? 1 : 2).replace(/\.0+$/, '') + '억';
  if (a >= 10000) return nf.format(Math.round(n / 10000)) + '만';
  return nf.format(n);
};
const pct = r => (Number(r) * 100).toFixed(Math.abs(Number(r)) < 0.001 ? 0 : 1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const numText = (v, cls) => (Number(v) > 0 ? won(v) : '<span class="zero">–</span>');

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- PIN 해시 ---------- */
async function pinHash(pin) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mp3ledger:' + pin));
    return 's:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    // file:// 등 보안 컨텍스트가 아닐 때의 간단 해시
    let h = 5381;
    const s = 'mp3ledger:' + pin;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'h:' + (h >>> 0).toString(16);
  }
}

/* ---------- 테마 ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#EEF2F9' : '#0A1020');
}

/* ---------- API 호출 (fetch → JSONP 폴백) ---------- */
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'mp3cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('network')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}

async function apiGet(params) {
  if (!state.api) return null;
  const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  const url = state.api + (state.api.indexOf('?') >= 0 ? '&' : '?') + qs;
  try {
    const res = await fetch(url, { method: 'GET', cache: 'no-store' });
    const txt = await res.text();
    const m = txt.match(/\{[\s\S]*\}/);
    return JSON.parse(m ? m[0] : txt);
  } catch (e) {
    try { return await jsonp(url); } catch (e2) { return { ok: false, code: 'offline', message: '연결할 수 없습니다' }; }
  }
}

/* ---------- 캐시 ---------- */
function cacheKey(m) { return KEY.cache + m; }
function readCache(m) {
  try { return JSON.parse(localStorage.getItem(cacheKey(m)) || 'null'); } catch (e) { return null; }
}
function writeCache(m, d) {
  try { localStorage.setItem(cacheKey(m), JSON.stringify(d)); } catch (e) {}
}

/* ============================================================
   게이트(잠금/연결) 화면
   ============================================================ */
function showGate() {
  $('#gate').hidden = false;
  $('#app').hidden = true;
  $('#gatePanel').hidden = false;
  $('#setupPanel').hidden = true;
  state.locked = true;
  state.pinBuf = '';
  drawDots();
  $('#gateErr').textContent = '';
}
function showSetup() {
  $('#gate').hidden = false;
  $('#app').hidden = true;
  $('#gatePanel').hidden = true;
  $('#setupPanel').hidden = false;
  $('#inpApi').value = state.api || '';
  $('#setupMsg').textContent = '';
  setTimeout(() => { if (!state.api) $('#inpApi').focus(); }, 120);
}
function showApp() {
  $('#gate').hidden = true;
  $('#app').hidden = false;
  state.locked = false;
}
function drawDots() {
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i < state.pinBuf.length));
}

function keyPress(k) {
  if (k === 'del') {
    state.pinBuf = state.pinBuf.slice(0, -1);
    drawDots();
    $('#gateErr').textContent = '';
    return;
  }
  if (state.pinBuf.length >= 4) return;
  state.pinBuf += k;
  drawDots();
  if (state.pinBuf.length === 4) setTimeout(submitPin, 110);
}

async function submitPin() {
  const pin = state.pinBuf;
  const saved = localStorage.getItem(KEY.hash);
  const h = await pinHash(pin);
  if (saved && saved === h) {
    unlock(pin);
    return;
  }
  // 저장된 해시가 없거나 다르면 서버에 확인 (PIN을 바꾼 경우 등)
  const res = await apiGet({ pin, ping: 1 });
  if (res && res.ok) {
    localStorage.setItem(KEY.hash, h);
    unlock(pin);
  } else if (res && res.code === 'pin') {
    failPin('비밀번호가 맞지 않습니다');
  } else {
    // 서버에 닿지 않았더라도 저장값이 없으면 열 수 없음
    failPin(saved ? '비밀번호가 맞지 않습니다' : '시트 연결이 필요합니다');
  }
}
function failPin(msg) {
  $('#gateErr').textContent = msg;
  const p = $('#gatePanel');
  p.classList.add('shake');
  setTimeout(() => p.classList.remove('shake'), 340);
  state.pinBuf = '';
  setTimeout(drawDots, 180);
  if (navigator.vibrate) navigator.vibrate(40);
}

/* ============================================================
   데이터 불러오기
   ============================================================ */
async function unlock(pin) {
  sessionPin = pin;
  state.pinBuf = pin;
  showApp();
  const startMonth = state.month || localStorage.getItem(KEY.month) || '';
  if (state.demo) {
    renderAll();
    return;
  }
  // 캐시가 있으면 즉시 보여주고, 뒤에서 새로 받아옵니다
  const cached = startMonth ? readCache(startMonth) : null;
  if (cached && cached.ok) {
    state.data = cached;
    state.months = cached.months || [];
    state.month = cached.month;
    renderAll();
  } else {
    $('#view').innerHTML = '<div class="card"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:85%;margin-top:12px"></div><div class="skeleton" style="width:40%;margin-top:12px"></div></div>';
  }
  await fetchMonth(state.month || '');
}

async function fetchMonth(month) {
  if (state.demo) return;
  state.busy = true;
  $('#btnRefresh').classList.add('busy');
  const pin = sessionPin || (state.pinBuf.length === 4 ? state.pinBuf : '');
  const res = await apiGet({ pin, month: month || '' });
  state.busy = false;
  $('#btnRefresh').classList.remove('busy');

  if (res && res.ok) {
    state.data = res;
    state.months = res.months && res.months.length ? res.months : [res.month];
    state.month = res.month;
    writeCache(res.month, res);
    localStorage.setItem(KEY.month, res.month);
    renderAll();
  } else if (res && res.code === 'pin') {
    showGate();
    $('#gateErr').textContent = '비밀번호가 맞지 않습니다';
  } else if (!state.data) {
    $('#view').innerHTML = '<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:24px">📡</div><p style="color:var(--sub);font-size:12.5px;margin:10px 0 0">시트에 연결하지 못했습니다.<br>전원·인터넷을 확인한 뒤 새로고침(↻)해 주세요.</p></div>';
    $('#metaLine').textContent = '연결 실패';
  } else {
    toast('최신 데이터를 못 받았습니다 (저장된 값 표시)');
  }
}

// 마지막으로 넣은 PIN (저장하지 않고 이 화면이 열려 있는 동안만 보관)
let sessionPin = '';

/* ============================================================
   렌더링
   ============================================================ */
function renderAll() {
  renderTabs();
  if (state.view === 'trend') renderTrend();
  else renderMonth();
  renderFoot();
}

function renderTabs() {
  const tabs = $('#tabs');
  const months = state.demo ? ['11월', '12월'] : (state.months.length ? state.months : [state.month]);
  let html = months.map(m =>
    `<button data-tab="month" data-month="${esc(m)}" class="${state.view === 'month' && state.month === m ? 'on' : ''}">${esc(m)}</button>`
  ).join('');
  html += `<button data-tab="trend" class="${state.view === 'trend' ? 'on' : ''}">월별 추이</button>`;
  tabs.innerHTML = html;
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.tab === 'trend') {
      state.view = 'trend';
      renderAll();
    } else {
      switchMonth(b.dataset.month);
    }
  });
}

async function switchMonth(m) {
  if (state.demo) { state.month = m; state.view = 'month'; state.data = demoPayload(m); renderAll(); return; }
  state.month = m;
  state.view = 'month';
  const cached = readCache(m);
  if (cached && cached.ok) {
    state.data = cached;
    renderAll();
    return;
  }
  state.data = null;
  $('#view').innerHTML = '<div class="card"><div class="skeleton" style="width:50%"></div><div class="skeleton" style="width:80%;margin-top:12px"></div></div>';
  await fetchMonth(m);
}

function renderMonth() {
  const d = state.data;
  if (!d || !d.ok) return;
  const s = d.summary || { revenue: 0, expense: 0, profit: 0 };
  const mix = d.mix || {};
  const exp = d.expense || {};
  const daily = d.daily || [];
  const monthNum = parseInt(String(d.month).replace(/[^0-9]/g, ''), 10);
  const year = d.year || new Date().getFullYear();

  const revenue = Number(s.revenue) || 0;
  const expense = Number(s.expense) || 0;
  const profit = Number(s.profit) || 0;
  const profitRate = revenue ? profit / revenue : 0;

  const filled = daily.filter(x => Number(x.total) > 0);
  const bestDay = filled.reduce((a, b) => (Number(b.total) > Number(a.total) ? b : a), filled[0] || null);
  const avg = filled.length ? filled.reduce((a, b) => a + Number(b.total), 0) / filled.length : 0;

  let html = '';

  if (state.demo) {
    html += `<div class="banner"><span>⚠️</span><div><b>예시 화면입니다.</b> 실제 금액이 아닌 안내용 숫자이고, 시트를 연결하면 진짜 가계부가 나옵니다.</div></div>`;
  }

  /* --- KPI --- */
  html += `
  <section class="kpi">
    <div class="card main">
      <div class="label">월 총매출 <span style="margin-left:auto;color:var(--muted);font-weight:500">${esc(d.month)}</span></div>
      <div class="value num">${won(revenue)}<small>원</small></div>
      <div class="spark-wrap">
        <div class="spark" id="spark">${sparkBars(daily)}</div>
        <div class="spark-legend"><span>1일</span><span>${filled.length ? `일평균 ${wonK(avg)} · 최고 ${bestDay ? bestDay.day + '일 ' + wonK(bestDay.total) : '-'}` : '기록 없음'}</span><span>${daily.length}일</span></div>
      </div>
    </div>
    <div class="card half">
      <div class="label">총지출</div>
      <div class="value num">${wonK(expense)}<small>원</small></div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:4px">매출의 ${revenue ? pct(expense / revenue) : '-'}</div>
    </div>
    <div class="card half">
      <div class="label">순익</div>
      <div class="value num ${profit >= 0 ? 'mint' : 'rose'}">${profit >= 0 ? '' : '-'}${wonK(Math.abs(profit))}<small>원</small></div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:4px">이익률 ${revenue ? pct(profitRate) : '-'}</div>
    </div>
  </section>`;

  /* --- 매출 비중 --- */
  const cw = Number(mix.cash) || 0, cc = Number(mix.card) || 0, ct = Number(mix.transfer) || 0;
  const tot = cw + cc + ct || 1;
  html += `
  <section class="card">
    <h2>매출 비중 <span>현금 · 카드 · 이체</span></h2>
    <div class="mixbar">
      <i class="d-cash" style="width:${(cw / tot * 100).toFixed(2)}%"></i>
      <i class="d-card" style="width:${(cc / tot * 100).toFixed(2)}%"></i>
      <i class="d-tr"   style="width:${(ct / tot * 100).toFixed(2)}%"></i>
    </div>
    <div class="legend">
      <div class="it"><div class="k"><b class="d-cash"></b>현금</div><div class="v num">${wonK(cw)}</div><div class="p num">${pct(cw / tot)}</div></div>
      <div class="it"><div class="k"><b class="d-card"></b>카드</div><div class="v num">${wonK(cc)}</div><div class="p num">${pct(cc / tot)}</div></div>
      <div class="it"><div class="k"><b class="d-tr"></b>이체</div><div class="v num">${wonK(ct)}</div><div class="p num">${pct(ct / tot)}</div></div>
    </div>
  </section>`;

  /* --- 지출 3분류 --- */
  html += `<h2 class="card" style="background:none;border:0;box-shadow:none;margin:16px 0 8px;padding:0;font-size:12.5px;color:var(--text)">
      지출 구성 <span style="font-weight:600;color:var(--muted);font-size:11.5px">합계 ${won(expense)}원</span></h2>`;

  const cats = buildCats(exp, expense);
  cats.forEach((c, i) => { html += catCard(c, i); });

  /* --- 일별 매출 --- */
  html += `
  <section class="card tbl" style="padding:12px 0 8px">
    <h2 style="padding:0 14px">일별 매출 <span>${esc(d.month)} 1일~${daily.length}일</span></h2>
    <div class="tr thead"><span>날짜</span><span class="td">현금</span><span class="td">카드</span><span class="td">이체</span><span class="td">합계</span></div>
    ${dailyRows(daily, monthNum, year, bestDay)}
    <div class="tr sum"><span>합계</span><span class="td">${won(cw)}</span><span class="td">${won(cc)}</span><span class="td">${won(ct)}</span><span class="td">${won(revenue)}</span></div>
  </section>`;

  /* --- 참고 --- */
  if (d.notes && d.notes.length) {
    html += `<section class="card"><h2>참고</h2><div class="notes" style="border-top:0;padding-top:0;margin-top:0">
      ${d.notes.slice(0, 8).map(n => `<p>${esc(n)}</p>`).join('')}
    </div></section>`;
  }

  $('#view').innerHTML = html;
  $('#metaLine').textContent = `${d.month} · ${updatedText(d.updatedAt)}`;
  bindCats();
}

function sparkBars(daily) {
  const max = Math.max(1, ...daily.map(x => Number(x.total) || 0));
  return daily.map(x => {
    const v = Number(x.total) || 0;
    const h = v > 0 ? Math.max(4, Math.round(v / max * 100)) : 2;
    return `<i class="${v > 0 ? 'on' : ''}" style="height:${h}%" title="${x.day}일 ${won(v)}"></i>`;
  }).join('');
}

function buildCats(exp, totalExpense) {
  const f = exp.fixed || { subtotal: 0, items: [] };
  const g = exp.goods || { subtotal: 0, online: {}, onsite: {}, liquor: {} };
  const e = exp.etc || { subtotal: 0, repair: {}, labor: {} };
  const on = g.online || { subtotal: 0, items: [] };
  const os = g.onsite || { subtotal: 0, items: [] };
  const lq = g.liquor || { subtotal: 0, items: [] };
  const rp = e.repair || { subtotal: 0, items: [] };
  const lb = e.labor || { subtotal: 0, items: [] };

  return [
    {
      no: '①', title: '고정비', sub: '월세 · 공과금 · 구독',
      amount: Number(f.subtotal) || 0,
      groups: [{
        label: '', items: (f.items || []).map(x => ({ name: x.name, memo: x.memo, amount: x.amount }))
      }]
    },
    {
      no: '②', title: '물품비용', sub: '온라인 · 현장 · 주류',
      amount: Number(g.subtotal) || 0,
      groups: [
        { label: '온라인 물품', amount: Number(on.subtotal) || 0, items: (on.items || []).map(x => ({ name: x.name, memo: x.memo, amount: x.amount })) },
        { label: '현장 지출', amount: Number(os.subtotal) || 0, items: (os.items || []).map(x => ({ name: x.vendor, memo: (x.date ? x.date + ' · ' : '') + (x.memo || ''), amount: x.amount })) },
        { label: '주류·음료', amount: Number(lq.subtotal) || 0, items: (lq.items || []).map(x => ({ name: x.name, memo: x.memo, amount: x.amount })) }
      ]
    },
    {
      no: '③', title: '수리·관리·인건비', sub: '알바 급여 포함',
      amount: Number(e.subtotal) || 0,
      groups: [
        { label: '수리·관리', amount: Number(rp.subtotal) || 0, items: (rp.items || []).map(x => ({ name: x.name, memo: x.memo, amount: x.amount })) },
        { label: '인건비', amount: Number(lb.subtotal) || 0, items: (lb.items || []).map(x => ({ name: x.name || x.type, memo: [x.type, x.memo].filter(Boolean).join(' · '), amount: x.amount })) }
      ]
    }
  ].filter(c => c.amount > 0 || c.groups.some(g2 => (g2.items || []).length || g2.amount > 0))
   .map(c => ({ ...c, share: totalExpense ? c.amount / totalExpense : 0 }));
}

function catCard(c, idx) {
  const groups = c.groups.filter(g => (g.items && g.items.length) || g.amount > 0);
  const showLabel = groups.length > 1;
  const body = groups.map(g => {
    let h = '';
    if (showLabel) {
      h += `<div class="row sub"><div class="nm">${esc(g.label)}</div><div class="amt num">${won(g.amount)}</div></div>`;
    }
    h += (g.items || []).filter(x => Number(x.amount) > 0 || x.name).map(x => `
      <div class="row">
        <div class="nm">${esc(x.name || '(이름 없음)')}${x.memo ? `<div class="memo">${esc(x.memo)}</div>` : ''}</div>
        <div class="amt num">${Number(x.amount) > 0 ? won(x.amount) : '<span class="zero" style="color:var(--muted)">–</span>'}</div>
      </div>`).join('');
    if (!(g.items || []).some(x => Number(x.amount) > 0 || x.name) && !showLabel) {
      h += `<div class="cat-empty">아직 입력된 항목이 없습니다.</div>`;
    }
    return h;
  }).join('');

  return `
  <div class="cat" data-cat="${idx}">
    <button class="cat-head" aria-expanded="false">
      <span class="no">${c.no}</span>
      <span>
        <span class="nm">${esc(c.title)}</span>
        <div class="sub">${esc(c.sub)}</div>
      </span>
      <span class="amt">
        <span class="num">${won(c.amount)}</span>
        <div class="pct num">지출의 ${pct(c.share)}</div>
      </span>
      <span class="chev">▶</span>
    </button>
    <div class="cat-body"><div><div class="items">${body}</div></div></div>
  </div>`;
}

function bindCats() {
  document.querySelectorAll('.cat').forEach(cat => {
    const head = cat.querySelector('.cat-head');
    head.onclick = () => {
      const open = cat.classList.toggle('open');
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
  });
}

const WD = ['일', '월', '화', '수', '목', '금', '토'];
function dailyRows(daily, monthNum, year, bestDay) {
  const today = new Date();
  return daily.map(x => {
    const dnum = Number(x.day) || 0;
    const wd = (monthNum && dnum) ? new Date(year, monthNum - 1, dnum).getDay() : null;
    const wdCls = wd === 6 ? 'sat' : wd === 0 ? 'sun' : '';
    const isToday = today.getFullYear() === year && (today.getMonth() + 1) === monthNum && today.getDate() === dnum;
    const total = Number(x.total) || 0;
    const best = bestDay && bestDay.day === x.day && total > 0;
    return `<div class="tr rb ${total ? '' : 'empty'} ${best ? 'best' : ''} ${isToday ? 'today' : ''}">
      <span class="day"><b>${dnum}</b><span class="${wdCls}">${wd != null ? WD[wd] : ''}</span></span>
      <span class="td">${numText(x.cash)}</span>
      <span class="td">${numText(x.card)}</span>
      <span class="td">${numText(x.transfer)}</span>
      <span class="td tot">${numText(total)}</span>
    </div>`;
  }).join('');
}

function updatedText(iso) {
  if (!iso) return '갱신 시각 없음';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '갱신 시각 없음';
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return sameDay ? `${hh}:${mm} 갱신` : `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm} 갱신`;
}

/* ---------- 월별 추이 ---------- */
function renderTrend() {
  const d = state.data;
  if (!d || !d.ok) return;
  const trend = state.demo ? demoTrend() : (d.trend || []);
  const maxV = Math.max(1, ...trend.map(t => Math.max(Number(t.revenue) || 0, Number(t.expense) || 0)));

  let html = `<h2 class="card" style="background:none;border:0;box-shadow:none;margin:0 0 8px;padding:0;font-size:12.5px">2026년 월별 추이</h2>`;
  html += `<section class="card">`;
  if (!trend.length) {
    html += `<div class="cat-empty">아직 월별 자료가 없습니다.</div>`;
  } else {
    html += trend.map(t => {
      const rev = Number(t.revenue) || 0, exp = Number(t.expense) || 0, pr = Number(t.profit) || 0;
      return `<div class="trend-item">
        <div class="m"><b>${esc(t.month)}</b>
          <span class="${pr >= 0 ? 'profit up' : 'profit down'}">순익 ${pr >= 0 ? '+' : '-'}${wonK(Math.abs(pr))}</span></div>
        <div class="bar-row"><span class="k">매출</span><span class="bar-track"><i class="rev" style="width:${rev / maxV * 100}%"></i></span><span class="v">${rev ? wonK(rev) : '–'}</span></div>
        <div class="bar-row"><span class="k">지출</span><span class="bar-track"><i class="exp" style="width:${exp / maxV * 100}%"></i></span><span class="v">${exp ? wonK(exp) : '–'}</span></div>
        <div class="split">
          <div class="kv"><span>고정비</span><b>${wonK(t.fixed)}</b></div>
          <div class="kv"><span>물품비용</span><b>${wonK(t.goods)}</b></div>
          <div class="kv"><span>수리·관리·인건비</span><b>${wonK(t.etc)}</b></div>
          <div class="kv"><span>현금/카드/이체</span><b>${wonK(t.cash)}/${wonK(t.card)}/${wonK(t.transfer)}</b></div>
        </div>
      </div>`;
    }).join('');
  }
  html += `</section>`;
  html += `<section class="card"><h2>월 합계 비교 <span>단위: 원</span></h2>
    <div class="tbl" style="padding:0">
      <div class="tr thead"><span>월</span><span class="td">매출</span><span class="td">지출</span><span class="td">순익</span><span></span></div>
      ${trend.map(t => `<div class="tr rb">
        <span class="day"><b>${esc(String(t.month).replace('월',''))}</b><span>월</span></span>
        <span class="td">${won(t.revenue)}</span>
        <span class="td">${won(t.expense)}</span>
        <span class="td tot" style="color:${Number(t.profit) >= 0 ? 'var(--mint)' : 'var(--rose)'}">${won(t.profit)}</span>
        <span></span></div>`).join('')}
    </div>
  </section>`;
  $('#view').innerHTML = html;
  $('#metaLine').textContent = `월별 추이 · ${updatedText(d.updatedAt)}`;
}

function renderFoot() {
  const src = state.demo ? '예시 데이터' : '구글 시트 「📊 엠팩3노래연습장 가계부 2026」';
  $('#foot').innerHTML = `데이터: ${src}<br>${state.demo ? '실제 금액이 아닙니다 (안내용)' : (state.api ? '시트에서 실시간으로 받아옵니다' : '시트 연결 전')}`;
}

/* ============================================================
   예시 데이터 (안내용 · 실제 금액 아님)
   ============================================================ */
function demoPayload(month) {
  month = month || '11월';
  const days = month === '12월' ? 31 : 30;
  const filled = month === '12월' ? 4 : 25;
  const daily = [];
  let c = 0, k = 0, t = 0;
  for (let i = 1; i <= days; i++) {
    if (i > filled) { daily.push({ day: i, cash: 0, card: 0, transfer: 0, total: 0 }); continue; }
    const cash = [0, 40, 62, 120, 55, 78, 0, 95, 33, 48][i % 10] * 1000;
    const card = (220 + ((i * 37) % 330)) * 1000;
    const tr = (18 + ((i * 13) % 60)) * 1000;
    c += cash; k += card; t += tr;
    daily.push({ day: i, cash, card, transfer: tr, total: cash + card + tr });
  }
  const revenue = c + k + t;
  const fixedItems = [
    { name: '월세 (달세)', amount: 3500000, memo: '(주)골드이엔지' },
    { name: '전기세', amount: 412000, memo: '여름 기준 예시' },
    { name: '신곡료', amount: 375000, memo: '15일 이체' },
    { name: '저작권료', amount: 85000, memo: '' },
    { name: '회원관리프로그램', amount: 33000, memo: '' },
    { name: '세무비', amount: 110000, memo: '' },
    { name: '인터넷·TV', amount: 25275, memo: '' },
    { name: '유선전화', amount: 6190, memo: '' },
    { name: '세스코', amount: 66000, memo: '' },
    { name: '쓰레기수거비', amount: 100000, memo: '' },
    { name: '복도청소비', amount: 100000, memo: '' }
  ];
  const fixed = fixedItems.reduce((a, b) => a + b.amount, 0);
  const online = { subtotal: 620000, items: [{ name: '가게물품', amount: 620000, memo: '쿠팡·네이버 합계' }] };
  const onsite = { subtotal: 60000, items: [{ date: '11/12', vendor: '식자재 매장', memo: '카드 승인', amount: 60000 }] };
  const liquor = { subtotal: 1350000, items: [{ name: '주류 전용카드 월간 청구액', amount: 1350000, memo: '월 1회' }] };
  const goods = online.subtotal + onsite.subtotal + liquor.subtotal;
  const labor = { subtotal: 3200000, items: [{ type: '평일오픈', name: '직원 A', amount: 2000000 }, { type: '주말오픈', name: '직원 B', amount: 1200000 }] };
  const repair = { subtotal: 150000, items: [{ name: '간판 수리', amount: 150000 }] };
  const etc = labor.subtotal + repair.subtotal;
  const expense = fixed + goods + etc;
  return {
    ok: true, month, year: 2026, demo: true,
    updatedAt: new Date().toISOString(),
    months: ['11월', '12월'],
    summary: { revenue, expense, profit: revenue - expense },
    mix: { cash: c, card: k, transfer: t, cashPct: c / revenue, cardPct: k / revenue, transferPct: t / revenue },
    daily,
    expense: {
      fixed: { subtotal: fixed, items: fixedItems },
      goods: { subtotal: goods, online, onsite, liquor },
      etc: { subtotal: etc, repair, labor }
    },
    notes: ['예시 화면입니다. 실제 시트를 연결하면 이 자리에 시트의 참고 메모가 표시됩니다.'],
    trend: demoTrend()
  };
}
function demoTrend() {
  return [
    { month: '11월', revenue: 9200000, expense: 7100000, profit: 2100000, cash: 1100000, card: 7200000, transfer: 900000, fixed: 4700000, goods: 2000000, etc: 400000 },
    { month: '12월', revenue: 3100000, expense: 4400000, profit: -1300000, cash: 350000, card: 2400000, transfer: 350000, fixed: 4300000, goods: 100000, etc: 0 }
  ];
}

/* ============================================================
   이벤트 연결
   ============================================================ */
document.querySelectorAll('#keypad button[data-k]').forEach(b => {
  b.onclick = () => keyPress(b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (state.locked && !$('#gate').hidden && !$('#gatePanel').hidden) {
    if (/^[0-9]$/.test(e.key)) keyPress(e.key);
    else if (e.key === 'Backspace') keyPress('del');
  }
});

$('#btnSetup').onclick = showSetup;
$('#btnBack').onclick = () => { state.demo = false; showGate(); };
$('#btnDemo2').onclick = () => startDemo();
$('#btnDemo3').onclick = () => startDemo();

function startDemo() {
  state.demo = true;
  state.months = ['11월', '12월'];
  state.month = '11월';
  state.view = 'month';
  state.data = demoPayload('11월');
  showApp();
  renderAll();
  toast('예시 화면입니다 — 실제 금액이 아닙니다');
}

$('#btnConnect').onclick = async () => {
  const url = $('#inpApi').value.trim();
  const pin = $('#inpPin').value.trim();
  const msg = $('#setupMsg');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url) && !/^https:\/\/script\.google\.com\/macros\/s\//.test(url)) {
    msg.textContent = '웹앱 주소가 형식에 맞지 않습니다 (…/exec 로 끝나야 합니다)';
    return;
  }
  if (!/^\d{4}$/.test(pin)) {
    msg.textContent = '4자리 비밀번호를 입력해 주세요';
    return;
  }
  msg.style.color = 'var(--sub)';
  msg.textContent = '연결 확인 중…';
  state.api = url;
  state.demo = false;
  const res = await apiGet({ pin, ping: 1 });
  if (res && res.ok) {
    localStorage.setItem(KEY.api, url);
    localStorage.setItem(KEY.hash, await pinHash(pin));
    sessionPin = pin;
    state.pinBuf = pin;
    msg.textContent = '';
    $('#gate').hidden = true;
    $('#app').hidden = false;
    state.locked = false;
    state.months = res.months || [res.month];
    state.month = res.month;
    state.data = res;
    writeCache(res.month, res);
    localStorage.setItem(KEY.month, res.month);
    renderAll();
    toast('시트에 연결되었습니다');
  } else if (res && res.code === 'pin') {
    msg.style.color = 'var(--rose)';
    msg.textContent = '비밀번호가 시트 쪽 설정(Code.gs)과 다릅니다';
  } else {
    msg.style.color = 'var(--rose)';
    msg.textContent = '연결하지 못했습니다. 주소와 배포 권한(모든 사용자)을 확인해 주세요';
  }
};

$('#btnTheme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(next);
  localStorage.setItem(KEY.theme, next);
};
$('#btnRefresh').onclick = async () => {
  if (state.demo) { toast('예시 화면은 새로고침이 없습니다'); return; }
  await fetchMonth(state.month);
  toast('최신 데이터로 갱신했습니다');
};
$('#btnLock').onclick = () => {
  state.demo = false;
  showGate();
  state.pinBuf = '';
  drawDots();
};

/* ============================================================
   시작
   ============================================================ */
(async function init() {
  const th = localStorage.getItem(KEY.theme);
  applyTheme(th || 'dark');

  state.api = localStorage.getItem(KEY.api) || DEFAULT_API || '';
  state.month = localStorage.getItem(KEY.month) || '';

  // 서비스 워커 (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  const hash = localStorage.getItem(KEY.hash);
  if (!state.api) { showSetup(); return; }
  showGate();

  // 저장된 PIN 해시가 있으면 생체처럼 바로 열지 않고, 잠금 화면에서 PIN을 받습니다.
  // (캐시만 먼저 그려 두어 PIN 입력 후 즉시 보이게)
  const cached = state.month ? readCache(state.month) : null;
  if (cached && cached.ok) { state.data = cached; state.months = cached.months || []; }
})();
</script>
